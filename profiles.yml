# aucun secret ici : tout passe par des variables d'environnement
retail_marketing:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: transformer
      warehouse: transforming_wh
      database: analytics
      schema: "dbt_{{ env_var('DBT_DEV_SCHEMA_SUFFIX', 'dev') }}"
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: transformer
      warehouse: transforming_wh
      database: analytics
      schema: prod
      threads: 8
