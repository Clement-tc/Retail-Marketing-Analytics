version: 2

models:
  - name: int_transactions__priced
    description: >
      Lignes de transactions valides (rejection_reason null), avec les mesures de
      prix calculées une seule fois : gross_amount, customer_paid_amount,
      total_discount_amount, gross_unit_price. Lu par fct_transactions et par le
      calcul RFM. Définitions détaillées des mesures : voir fct_transactions.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - basket_id
              - product_id