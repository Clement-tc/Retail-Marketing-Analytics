version: 2

models:
  - name: stg_dunnhumby__campaigns
    description: "Une ligne par campagne marketing."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_day >= start_day"
    columns:
      - name: campaign_id
        description: "Identifiant de la campagne."
        data_tests:
          - unique
          - not_null
      - name: campaign_type
        description: "Type de campagne (TypeA, TypeB, TypeC)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TypeA', 'TypeB', 'TypeC']
      - name: start_day
        description: "Jour de début (1 = premier jour du dataset)."
      - name: end_day
        description: "Jour de fin."
      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."
      - name: _batch_id
        description: "Lot de livraison (history, week_91...)."

  - name: stg_dunnhumby__transactions        # ← same list, no second "models:"
    description: "Une ligne par produit et par ticket de caisse."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - basket_id
              - product_id
    columns:
      - name: household_id
        description: "Identifiant du foyer."
        data_tests:
          - not_null
      - name: basket_id
        description: "Identifiant du ticket de caisse."
        data_tests:
          - not_null
      - name: day_number
        description: "Numéro du jour (1 à 711), pas une date."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 711
      - name: product_id
        description: "Identifiant du produit."
        data_tests:
          - not_null
      - name: quantity
        description: "Quantité achetée."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: sales_value
        description: "Montant encaissé par le magasin."
      - name: store_id
        description: "Identifiant du magasin."
      - name: retail_discount
        description: "Remise carte fidélité, en positif."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
              config:
                severity: warn        # 36 lignes anormales dans la source
      - name: transaction_time_hhmm
        description: "Heure de passage en caisse, format HHMM (1631 = 16h31)."
      - name: week_number
        description: "Numéro de semaine (1 à 102)."
      - name: coupon_discount
        description: "Remise coupon fabricant, en positif."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: coupon_match_discount
        description: "Remise du magasin qui s'aligne sur le coupon fabricant, en positif."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."
      - name: _batch_id
        description: "Lot de livraison (history, week_91...)."

#PRODUCTS

  - name: stg_dunnhumby__products
    description: >
      Une ligne par produit du catalogue, dans sa version la plus récente.
      La source est remplacée à chaque livraison : les changements de catégorie
      écrasent l'ancienne version (l'historique sera conservé par le snapshot).
    columns:
      - name: product_id
        description: "Identifiant du produit. Clé de jointure avec les transactions et les coupons."
        data_tests:
          - not_null
          - unique

      - name: manufacturer_id
        description: "Code du fabricant (identifiant anonymisé, pas un nom)."

      - name: department
        description: "Rayon, niveau le plus large de la hiérarchie produit (ex. GROCERY, PRODUCE). Null si non renseigné."
        data_tests:
          - dbt_utils.not_empty_string

      - name: brand
        description: "Type de marque : National (marque nationale) ou Private (marque distributeur)."

      - name: commodity_description
        description: >
          Catégorie produit, niveau intermédiaire de la hiérarchie (ex. BREAD).
          Null si non renseignée : concerne 490 produits, tous du rayon MISC. TRANS.,
          qui sert de rayon fourre-tout pour des produits mal référencés
          (fruits, bière, hygiène...). Poids négligeable : environ 0,1 % des ventes.
        data_tests:
          - dbt_utils.not_empty_string
          - dbt_utils.not_accepted_values:
              arguments:
                values: ['NO COMMODITY DESCRIPTION']

      - name: sub_commodity_description
        description: "Sous-catégorie, niveau le plus fin de la hiérarchie (ex. BREAD:ITALIAN/FRENCH). Null si non renseignée."
        data_tests:
          - dbt_utils.not_empty_string
          - dbt_utils.not_accepted_values:
              arguments:
                values: ['NO SUBCOMMODITY DESCRIPTION']

      - name: size_of_product
        description: "Taille de l'emballage telle que fournie par la source (ex. 50 OZ, 24 CT), non décomposée. Null si non renseignée."
        data_tests:
          - dbt_utils.not_empty_string

      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."

      - name: _batch_id
        description: "Lot de livraison qui a fourni cette version du catalogue (history, week_91...)."

