version: 2

models:
  - name: stg_dunnhumby__campaigns
    description: "Une ligne par campagne marketing."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_day >= start_day"
    columns:
      - name: campaign_id
        description: "Identifiant de la campagne."
        data_tests:
          - unique
          - not_null
      - name: campaign_type
        description: "Type de campagne (TypeA, TypeB, TypeC)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TypeA', 'TypeB', 'TypeC']
      - name: start_day
        description: "Jour de début (1 = premier jour du dataset)."
      - name: end_day
        description: "Jour de fin."
      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."
      - name: _batch_id
        description: "Lot de livraison (history, week_91...)."

  - name: stg_dunnhumby__transactions        # ← same list, no second "models:"
    description: "Une ligne par produit et par ticket de caisse."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - basket_id
              - product_id
    columns:
      - name: household_id
        description: "Identifiant du foyer."
        data_tests:
          - not_null
      - name: basket_id
        description: "Identifiant du ticket de caisse."
        data_tests:
          - not_null
      - name: day_number
        description: "Numéro du jour (1 à 711), pas une date."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 711
      - name: product_id
        description: "Identifiant du produit."
        data_tests:
          - not_null:
              config:
                where: "rejection_reason is null"
      - name: quantity
        description: "Quantité achetée."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
              config:
                where: "rejection_reason is null"
      - name: sales_value
        description: "Montant encaissé par le magasin."
      - name: store_id
        description: "Identifiant du magasin."
      - name: retail_discount
        description: "Remise carte fidélité, en positif."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
              config:
                severity: warn        # 36 lignes anormales dans la source
      - name: transaction_time_hhmm
        description: "Heure de passage en caisse, format HHMM (1631 = 16h31)."
      - name: week_number
        description: "Numéro de semaine (1 à 102)."
      - name: coupon_discount
        description: "Remise coupon fabricant, en positif."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: coupon_match_discount
        description: "Remise du magasin qui s'aligne sur le coupon fabricant, en positif."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: rejection_reason
        description: >
          Motif de rejet de la ligne, null si la ligne est valide. Les marts ne
          gardent que les lignes valides. Quantité négative traitée comme une
          erreur : la source historique n'en contient aucune.
        data_tests:
          - accepted_values:
              arguments:
                values: ['missing_product_id', 'negative_quantity']
      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."
      - name: _batch_id
        description: "Lot de livraison (history, week_91...)."

#PRODUCTS

  - name: stg_dunnhumby__products
    description: >
      Une ligne par produit du catalogue, dans sa version la plus récente.
      La source est remplacée à chaque livraison : les changements de catégorie
      écrasent l'ancienne version (l'historique sera conservé par le snapshot).
    columns:
      - name: product_id
        description: "Identifiant du produit. Clé de jointure avec les transactions et les coupons."
        data_tests:
          - not_null
          - unique

      - name: manufacturer_id
        description: "Code du fabricant (identifiant anonymisé, pas un nom)."

      - name: department
        description: "Rayon, niveau le plus large de la hiérarchie produit (ex. GROCERY, PRODUCE). Null si non renseigné."
        data_tests:
          - dbt_utils.not_empty_string

      - name: brand
        description: "Type de marque : National (marque nationale) ou Private (marque distributeur)."

      - name: commodity_description
        description: >
          Catégorie produit, niveau intermédiaire de la hiérarchie (ex. BREAD).
          Null si non renseignée : concerne 490 produits, tous du rayon MISC. TRANS.,
          qui sert de rayon fourre-tout pour des produits mal référencés
          (fruits, bière, hygiène...). Poids négligeable : environ 0,1 % des ventes.
        data_tests:
          - dbt_utils.not_empty_string
          - dbt_utils.not_accepted_values:
              arguments:
                values: ['NO COMMODITY DESCRIPTION']

      - name: sub_commodity_description
        description: "Sous-catégorie, niveau le plus fin de la hiérarchie (ex. BREAD:ITALIAN/FRENCH). Null si non renseignée."
        data_tests:
          - dbt_utils.not_empty_string
          - dbt_utils.not_accepted_values:
              arguments:
                values: ['NO SUBCOMMODITY DESCRIPTION']

      - name: size_of_product
        description: "Taille de l'emballage telle que fournie par la source (ex. 50 OZ, 24 CT), non décomposée. Null si non renseignée."
        data_tests:
          - dbt_utils.not_empty_string

      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."

      - name: _batch_id
        description: "Lot de livraison qui a fourni cette version du catalogue (history, week_91...)."

#COUPONS
  - name: stg_dunnhumby__coupons
    description: ""
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
            - coupon_upc
            - campaign_id
            - product_id
    columns:
      - name: coupon_upc
        data_type: number
        description: "Codes-barres de coupons."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{11}$'
      - name: product_id
        data_type: number
        description: "Identifiant du produit associe"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dunnhumby__products')
                field: product_id

      - name: campaign_id
        data_type: number
        description: "Identifiant de la campagne"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dunnhumby__campaigns')
                field: campaign_id
      - name: _loaded_at
        data_type: timestamp_ltz
        description: ""

      - name: _batch_id
        data_type: varchar
        description: ""


  - name: stg_dunnhumby__coupon_redemptions
    description: >
      Une ligne par coupon utilisé par un foyer, un jour donné. La source n'a ni
      ticket ni heure : deux utilisations du même coupon le même jour seraient
      indiscernables d'un doublon. Ce cas n'apparaît pas dans les données
      (0 ligne identique), on ne dédoublonne donc pas.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - household_id
              - day_number
              - coupon_upc
              - campaign_id
          config:
            severity: warn
    columns: 
      - name: day_number
        data_type: number
        description: ""
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 711

      - name: coupon_upc
        data_type: number
        description: ""
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^[0-9]{11}$'
          - relationships:
              arguments:
                to: ref('stg_dunnhumby__coupons')
                field: coupon_upc
      - name: campaign_id
        data_type: number
        description: ""
        data_tests:
          - not_null
          - relationships:
              arguments:
              to: ref('stg_dunnhumby__campaigns')
              field: campaign_id
      - name: _loaded_at
        data_type: timestamp_ltz
        description: ""

      - name: _batch_id
        data_type: varchar
        description: ""


#CAMPAIGN_HOUSEHOLDS

  - name: stg_dunnhumby__campaign_households
    description: >
      Une ligne par foyer ciblé par une campagne marketing. Sert à distinguer
      les foyers ciblés des non ciblés pour mesurer l'effet des campagnes.
      1 584 foyers ciblés, dont 824 sans profil démographique : pas de test
      relationships vers stg_dunnhumby__households, qui ne couvre que les foyers
      avec profil (le test sera porté par dim_households).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
           arguments:
            combination_of_columns:
              - campaign_id
              - household_id
    columns:
      - name: campaign_type
        description: "Type de campagne (TypeA, TypeB, TypeC), identique à celui de stg_dunnhumby__campaigns."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TypeA', 'TypeB', 'TypeC']

      - name: household_id
        description: "Identifiant du foyer ciblé."
        data_tests:
          - not_null

      - name: campaign_id
        description: "Identifiant de la campagne qui cible le foyer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dunnhumby__campaigns')
                field: campaign_id

      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."

      - name: _batch_id
        description: "Lot de livraison (history, week_91...)."

#HOUSEHOLDS
  - name: stg_dunnhumby__households
    description: >
      Une ligne par foyer disposant d'un profil démographique : 801 foyers sur 2 500.
      Attention au biais : ces foyers sont plus actifs que la moyenne (55 % des lignes
      de transactions pour 32 % des foyers). Ce n'est pas la liste complète des foyers,
      qui sera construite dans dim_households. Les valeurs Unknown de la source sont
      converties en null.
    columns:
      - name: household_id
        description: "Identifiant du foyer."
        data_tests:
          - not_null
          - unique

      - name: age_range
        description: "Tranche d'âge du chef de foyer."
        data_tests:
          - accepted_values:
              arguments:
                values: ['19-24', '25-34', '35-44', '45-54', '55-64', '65+']

      - name: marital_status_code
        description: "Code situation maritale brut de la source (A, B, U), conservé pour tracer les null et détecter un nouveau code."
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'U']

      - name: marital_status
        description: >
          Situation maritale, décodée par hypothèse depuis le code source
          (A = married, B = single, U = null). Le décodage n'est pas documenté par
          dunnhumby : il est déduit du croisement avec la composition du foyer.
        data_tests:
          - accepted_values:
              arguments:
                values: ['married', 'single']

      - name: income_bracket
        description: "Tranche de revenu annuel du foyer, en dollars."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Under 15K', '15-24K', '25-34K', '35-49K', '50-74K', '75-99K',
                         '100-124K', '125-149K', '150-174K', '175-199K', '200-249K', '250K+']

      - name: ownership_status
        description: "Statut d'occupation du logement. Null si inconnu (233 foyers)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Homeowner', 'Renter', 'Probable Renter', 'Probable Owner']

      - name: household_composition
        description: "Composition du foyer (adultes, enfants). Null si inconnue (73 foyers)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['2 Adults No Kids', '2 Adults Kids', 'Single Female', 'Single Male', '1 Adult Kids']

      - name: household_band
        description: "Nombre de personnes dans le foyer, en tranches (1 à 5+)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5+']

      - name: kids_band
        description: >
          Nombre d'enfants, en tranches (0, 1, 2, 3+). La source mélange « aucun » et
          « inconnu » dans None/Unknown : déduit à 0 depuis la composition du foyer
          (2 Adults No Kids, et par hypothèse Single Female / Single Male), null pour
          les 64 foyers sans information.
        data_tests:
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3+']

      - name: _loaded_at
        description: "Horodatage de chargement dans RAW."

      - name: _batch_id
        description: "Lot de livraison (history, week_91...)."
