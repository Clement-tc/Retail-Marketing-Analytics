name: retail_marketing
version: "1.0.0"
config-version: 2

profile: retail_marketing

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  retail_marketing:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

vars:
  calendar_days: 730    # 2 years: covers the transactions (711) and the campaigns (up to 719)
  # mesure d'effet des campagnes : tranches de dépense avant campagne
  # 3, 5 et 10 tranches testées : l'uplift converge à partir de 5 (0,77 / 1,02 / 1,12 €),
  # 10 tranches font perdre des campagnes faute de foyers comparables
  uplift_spend_bands: 5
  uplift_min_households_per_band: 5    # par groupe (ciblés et témoins) pour qu'une tranche compte
  incremental_lookback_days : 3       #Nombre de jours précedent à inclure dans le refresh incrémental
  # contrôle de volume : écart toléré entre une livraison et la moyenne des 4 semaines précédentes
  volume_tolerance_pct: 0.3