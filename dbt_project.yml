name: retail_marketing
version: "1.0.0"
config-version: 2

profile: retail_marketing

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  retail_marketing:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

vars:
  calendar_days: 730    # 2 years: covers the transactions (711) and the campaigns (up to 719)